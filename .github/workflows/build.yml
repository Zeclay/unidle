name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sanity check
        run: python -m py_compile unidle.py settings_ui.py

      - name: Generate icon
        run: python assets/generate_icon.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name Unidle --icon assets/icon.ico unidle.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --windowed --name Unidle --icon assets/icon.icns unidle.py

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/Unidle.exe -DestinationPath Unidle-windows.zip
        shell: pwsh

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../Unidle-macos.zip Unidle.app

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Unidle-windows
          path: Unidle-windows.zip

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Unidle-macos
          path: Unidle-macos.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Unidle-windows.zip
            Unidle-macos.zip
